<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>small-target</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      .hit {
        position: relative;
        width: 24px;
        height: 24px;
        padding: 0;
      }
      .hit::after {
        content: '';
        position: absolute;
        inset: -14px;
      }
      .dot {
        width: 12px;
        height: 12px;
        padding: 0;
      }
    </style>
  </head>
  <!-- Only a finger needs room: on a computer nothing here is found. -->
  <body>
    <section style="display: flex; align-items: center; gap: 12px">
      <!-- Far too small: under 32 px. -->
      <button
        id="s-icon"
        data-expect="small-target@phone"
        style="width: 24px; height: 24px; padding: 0"
        aria-label="Close"
      >
        ×
      </button>
      <!-- A little too small. -->
      <a
        id="s-link"
        data-expect="small-target@phone"
        href="#x"
        style="
          display: inline-block;
          height: 36px;
          padding: 0 12px;
          line-height: 36px;
          background: #eef;
        "
        >Small link</a
      >
      <button class="ctl">Big enough</button>
    </section>

    <!-- Small buttons alike, the cells of a grid: one finding for all,
         named by the first. -->
    <section style="display: flex; gap: 12px">
      <button
        id="s-dot"
        data-expect="small-target@phone"
        class="dot"
        aria-label="Day 1"
      ></button>
      <button class="dot" aria-label="Day 2"></button>
      <button class="dot" aria-label="Day 3"></button>
      <button class="dot" aria-label="Day 4"></button>
    </section>

    <!-- Decoy: a link inside running words. -->
    <p style="width: 300px">
      Words with <a href="#x">a link</a> inside them, and more words after it.
    </p>

    <!-- Decoy: a small checkbox inside a label a finger can hit. -->
    <label
      style="
        display: flex;
        align-items: center;
        gap: 8px;
        width: 240px;
        min-height: 44px;
      "
    >
      <input type="checkbox" style="width: 16px; height: 16px; margin: 0" />
      Remember me
    </label>

    <!-- Decoy: a small disabled button. -->
    <section>
      <button disabled style="width: 24px; height: 24px; padding: 0">-</button>
    </section>

    <!-- Decoy: a small button whose hit area is drawn larger. -->
    <section style="padding: 10px">
      <button class="hit" aria-label="Enlarged">+</button>
    </section>

    <!-- Decoy: a small button hidden under an open bottom sheet. -->
    <button
      aria-label="Hidden"
      style="
        position: absolute;
        top: 700px;
        left: 16px;
        width: 24px;
        height: 24px;
        padding: 0;
      "
    >
      ?
    </button>
    <div
      data-floating-popup
      style="
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 200px;
        padding: 16px;
        border-top: 1px solid #888;
        background: #fff;
      "
    >
      <p>A sheet over the bottom of the page.</p>
      <button class="ctl">Big enough</button>
    </div>
  </body>
</html>
