<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>broken-image</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <!-- A picture whose file is missing. -->
    <section>
      <img
        id="b-gone"
        data-expect="broken-image"
        src="missing-picture.png"
        alt="Gone"
        width="80"
        height="60"
      />
    </section>

    <!-- Decoy: a picture that loads. -->
    <section>
      <img
        alt="Fine"
        width="80"
        height="60"
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
      />
    </section>

    <!-- Decoy: a drawing with no size of its own. -->
    <section>
      <img
        alt="No size"
        width="80"
        height="60"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='10' height='10'/%3E%3C/svg%3E"
      />
    </section>

    <!-- Decoy: a missing picture that is not shown. -->
    <section>
      <img alt="Hidden" src="missing-hidden.png" style="display: none" />
    </section>

    <!-- Decoy: a picture far below, left to load lazily. -->
    <section style="margin-top: 6000px">
      <img
        alt="Far"
        loading="lazy"
        src="missing-far.png"
        width="80"
        height="60"
      />
    </section>
  </body>
</html>
